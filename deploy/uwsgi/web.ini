# Copy of docker/uwsgi.ini for the web containers, minus the migrate hook and
# the attach-daemon lines: migrations run in the `migrate` service and
# sendalerts/sendreports run in their own services (see compose.yml for why).
# Keep the rest in sync with docker/uwsgi.ini when upgrading.
[uwsgi]
strict
master
die-on-term
if-not-env = LISTEN_IPV6
http-socket = :8000
endif =
if-env = LISTEN_IPV6
http-socket = [::]:8000
endif =
harakiri = 10
buffer-size = 32768
post-buffering = 16192
if-not-env = UWSGI_PROCESSES
processes = 4
endif =
auto-procname
enable-threads
threads = 1
chdir = /opt/healthchecks
module = hc.wsgi:application
thunder-lock
disable-write-exception

# workaround for https://github.com/unbit/uwsgi/issues/2299
max-fd = 10000
